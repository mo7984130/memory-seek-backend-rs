[workspace]
resolver = "3"
members = [
    "common",
    "common/core",
    "common/crypto",
    "types",
    "types/core",
    "types/token",
    "types/db-api",
    "types/backup",
    "types/audit",
    "types/identity",
    "types/visual",
    "types/schema",
    "libs/common_macros",
    "libs/file_validator",
    "libs/email",
    "libs/oss",
    "libs/step_derive",
    "domains/constants",
    "domains/audit",
    "domains/auth",
    "domains/user",
    "domains/visual",
    "domains/backup",
    "server",
    "tests/e2e"
]

[profile.release]
opt-level = 3
debug = false
strip = "symbols"
# debug = 2
# strip = false
debug-assertions = false
overflow-checks = false
lto = "thin"
panic = "abort"
codegen-units = 1
rpath = false

[workspace.dependencies]
types = { path = "types" }
types-core = { path = "types/core" }
types-token = { path = "types/token" }
types-db-api = { path = "types/db-api" }
types-backup = { path = "types/backup" }
types-audit = { path = "types/audit" }
types-identity = { path = "types/identity" }
types-visual = { path = "types/visual" }
types-schema = { path = "types/schema" }
axum = { version = "0.8.8", features = ["macros"] }
tokio = { version = "1.49.0", features = ["full"] }
tokio-util = { version = "0.7" }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

tracing = "0.1.44"
tracing-subscriber = "0.3.22"

sea-orm = { version = "2.0.3", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
] }
chrono = { version = "0.4.44", features = ["serde"] }
thiserror = "2.0.18"
derive_more = { version = "1", default-features = false, features = ["from", "into", "display", "deref"] }
ts-rs = { version = "12", features = ["chrono-impl", "no-serde-warnings"] }
bcrypt = "0.19.0"
argon2 = { version = "0.5", features = ["std"] }
password-hash = "0.5"
redis = "1.0.4"
deadpool-redis = "0.23.0"
rand = "0.10.0"
hex = "0.4.3"
validator = { version="0.20.0", features = ["derive"] }
regex = "1.12.3"
lettre = { version = "0.11.19", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "hostname", "builder"] }
uuid = { version = "1.21.0", features = ["v4"] }
futures = "0.3.32"
const_format = "0.2.35"
image = "0.25.9"
nom-exif = "3"
config = { version = "0.15.19", features = ["yaml"] }
async-trait = "0.1.89"
http-body-util = "0.1"

blake3 = "1.8.2"
base64 = "0.22.1"
sha2 = "0.10.8"
hkdf = "0.12.4"
aes-gcm = "0.10"

# 性能监控
metrics = "0.24.3"

# HTTP & S3
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
s3 = { package = "rust-s3", version = "0.37", default-features = false, features = ["tokio-rustls-tls", "fail-on-err"] }
bytes = "1.10"
linkme = "0.3"

# Snowflake ID
snowflaked = { version = "1.0.3", features = ["sync"] }

insight-face-rs = { version = "4.2.0" , features = ["sea-orm", "tokio", "load-dynamic"] }

multi-level-cache = { version = "0.1.1", features = ["redis-deadpool"] }

# Backup
async-compression = { version = "0.4", features = ["tokio", "zstd"] }
futures-util = "0.3"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# 中文转拼音(人物姓名首字母)
pinyin = "0.11.0"

metrics-exporter-prometheus = "0.18.3"
sysinfo = "0.39.6"
dashmap = "6.2.1"
