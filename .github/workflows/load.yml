name: Load Test

on:
    workflow_dispatch:
        inputs:
            mode:
                description: "compare = 对比基线(默认); baseline = 刷新 develop 基线"
                required: true
                type: choice
                default: compare
                options:
                    - compare
                    - baseline
            ref:
                description: "被测分支/ref, 默认 develop(main 分支的 workflow 不含缓存/诊断逻辑)"
                required: false
                type: string
                default: "develop"
            runs:
                description: "每场景压测轮次(取中位数)"
                required: false
                type: number
                default: 3
            pr_number:
                description: "将报告发布为该 PR 评论(可选)"
                required: false
                type: number
                default: 0
    schedule:
        # 每周一 02:00 自动刷新 develop 基线
        - cron: "0 2 * * 1"

jobs:
    load:
        runs-on: ubuntu-latest
        env:
            FEATURES: metrics,auth,user,photo
            RUNS: ${{ inputs.runs || 3 }}
            MODE: ${{ github.event_name == 'schedule' && 'baseline' || inputs.mode || 'compare' }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.ref || github.ref }}

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable

            - uses: Swatinem/rust-cache@v2

            # 显式缓存 release 二进制: 仅 Rust 源码/依赖变化时才失效
            # (Swatinem/rust-cache 缓存的是依赖 target, 与 ci.yml 的 debug 产物不互通)
            # key 用源码内容 hash 而非 commit sha, 避免改压测脚本/workflow 也触发重编
            - name: 计算源码缓存 key
              id: src-hash
              run: echo "hash=${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'common/**', 'types/**', 'domains/**', 'libs/**', 'server/**') }}" >> "$GITHUB_OUTPUT"

            - name: 恢复 release 二进制缓存
              id: release-bin
              uses: actions/cache/restore@v4
              with:
                  path: target/release/memory-seek-server
                  key: load-bin-${{ steps.src-hash.outputs.hash }}

            - name: Build (release + metrics)
              if: steps.release-bin.outputs.cache-hit != 'true'
              run: cargo build --release --features "$FEATURES"

            - name: 保存 release 二进制缓存
              if: steps.release-bin.outputs.cache-hit != 'true'
              uses: actions/cache/save@v4
              with:
                  path: target/release/memory-seek-server
                  key: load-bin-${{ steps.src-hash.outputs.hash }}

            - name: Install k6
              uses: grafana/setup-k6-action@v1
              with:
                  # 场景脚本使用可选链 ?., 需 >= 0.50(0.49 编译器不支持)
                  k6-version: 0.57.0

            - name: 启动依赖容器 (PG / Redis)
              run: docker compose -f tests/load/docker-compose.load.yml up -d --wait

            - name: 启动被测服务
              run: |
                  ./target/release/memory-seek-server \
                      --config tests/load/ci/server-config.yml \
                      --log-dir tests/load/ci/logs \
                      > server.log 2>&1 &
                  echo $! > server.pid
                  for i in $(seq 1 60); do
                      if curl -sf http://127.0.0.1:7985/health >/dev/null; then
                          echo "server ready"
                          exit 0
                      fi
                      sleep 1
                  done
                  echo "server failed to start"
                  tail -100 server.log
                  exit 1

            - name: 种子数据 (建表 + 灌数据)
              # 不再容错: seed 失败必须暴露(否则压测会在无表库上全量报错)
              run: make -C tests/load seed

            - name: 全场景压测 (${{ env.RUNS }} 轮)
              run: make -C tests/load run-all RUNS=$RUNS

            - name: 归一化(取中位数)
              run: make -C tests/load collect

            - name: 服务端指标快照
              run: make -C tests/load prometheus || true

            - name: 记录基线 (baseline 模式)
              if: env.MODE == 'baseline'
              run: make -C tests/load record-baseline

            - name: 恢复基线缓存 (compare 模式)
              if: env.MODE == 'compare'
              uses: actions/cache/restore@v4
              with:
                  path: tests/load/baselines
                  key: load-baseline-develop-
                  restore-keys: load-baseline-develop-

            - name: 判定 (compare 模式)
              if: env.MODE == 'compare'
              run: make -C tests/load judge

            - name: 生成报告 (compare 模式)
              if: env.MODE == 'compare'
              run: make -C tests/load report

            - name: 保存基线缓存 (baseline 模式)
              if: env.MODE == 'baseline'
              continue-on-error: true # 同 sha 重复保存时忽略冲突
              uses: actions/cache/save@v4
              with:
                  path: tests/load/baselines
                  key: load-baseline-develop-${{ github.sha }}

            - name: 上传结果 (artifact, 无论成败)
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: load-results-${{ env.MODE }}-${{ github.sha }}
                  path: |
                      tests/load/results
                      server.log

            - name: 失败诊断 (打印 server.log 与结果目录)
              if: failure()
              run: |
                  echo "===== server.log (tail 200) ====="
                  tail -200 server.log 2>/dev/null || echo "(server.log 不存在)"
                  echo "===== results 目录 ====="
                  ls -la tests/load/results/ 2>/dev/null || true

            - name: 发布 PR 评论 (compare 模式 + 指定 pr_number)
              if: env.MODE == 'compare' && inputs.pr_number != 0
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('fs');
                      const path = 'tests/load/results/report.md';
                      if (!fs.existsSync(path)) {
                          console.log('report.md 不存在, 跳过评论');
                          return;
                      }
                      let body = fs.readFileSync(path, 'utf8');
                      if (body.length > 60000) body = body.slice(0, 60000) + '\n...(已截断)';
                      await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: ${{ inputs.pr_number }},
                          body
                      });
