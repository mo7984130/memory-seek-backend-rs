[defaults]
# 仅在 deploy/ansible 目录下执行 ansible-playbook 时自动生效
inventory = inventory
roles_path = roles
# 单机部署统一用 root; 需要别的用户时用 -u 覆盖
remote_user = root
interpreter_python = auto_silent
retry_files_enabled = False
deprecation_warnings = False

[ssh_connection]
# 减少每个任务建立 SSH 连接的开销; 被管机为 Linux, sudo 无 requiretty
pipelining = True
