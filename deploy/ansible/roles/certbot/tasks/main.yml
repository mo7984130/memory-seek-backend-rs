---
- name: 安装 certbot
  apt:
    name:
      - certbot
    state: present
    update_cache: true

- name: 检查证书是否存在
  stat:
    path: /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem
  register: cert_exists

- name: 申请 Let's Encrypt 证书（已存在则跳过）
  command:
    argv:
      - certbot
      - certonly
      - --webroot
      - -w
      - /var/www/{{ domain_name }}
      - -d
      - "{{ domain_name }}"
      - --non-interactive
      - --agree-tos
      - --email
      - "{{ letsencrypt_email }}"
  when: not cert_exists.stat.exists

- name: 配置自动续期
  systemd:
    name: certbot.timer
    state: started
    enabled: true
