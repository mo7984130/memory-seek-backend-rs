name: Release

on:
    push:
        branches: [main]
    workflow_dispatch:

env:
    CARGO_TERM_COLOR: always
    BINARY_NAME: memory-seek-server

# 版本由人在 PR 里通过 tools/bump-version.sh 决定(写进 server/Cargo.toml),
# 本 workflow 只负责: 发现新版本 -> 构建 -> 打 tag -> 发布。
# tag 已存在说明本次合并没有递增版本, 直接跳过, 不做任何发布。
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 需要完整 tag 历史来判断该版本是否已发布
          fetch-depth: 0
          # server/build.rs 无条件链接 thirdparty/onnxruntime, 必须是真实 .so
          lfs: true

      - name: 读取版本
        id: version
        run: |
          version=$(awk '
              /^\[/ { if (done) exit; in_pkg = ($0 == "[package]"); next }
              in_pkg && /^version = "/ { sub(/^version = "/, ""); sub(/"$/, ""); print; done = 1; exit }
          ' server/Cargo.toml)
          if [[ -z "$version" ]]; then
              echo "错误: 无法从 server/Cargo.toml 的 [package] 段读取 version" >&2
              exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
              echo "published=true" >> "$GITHUB_OUTPUT"
          else
              echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 已发布则跳过
        if: steps.version.outputs.published == 'true'
        run: echo "v${{ steps.version.outputs.version }} 已存在, 本次合并未递增版本, 跳过发布"

      - name: Install Rust toolchain
        if: steps.version.outputs.published == 'false'
        uses: dtolnay/rust-toolchain@stable

      - name: Install mold
        if: steps.version.outputs.published == 'false'
        # .cargo/config.toml 指定 -fuse-ld=mold, 缺失时链接会直接报错
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Cache Cargo
        if: steps.version.outputs.published == 'false'
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        if: steps.version.outputs.published == 'false'
        # 只构建 server: 仓库根是 virtual manifest 且未设 default-members,
        # 不带 -p 会把全部成员(含 tests/e2e)一起编译, 白白增加构建时间与缓存体积
        run: cargo build --release --all-features -p server

      - name: 打包 Release
        if: steps.version.outputs.published == 'false'
        run: |
          mkdir -p release
          cp target/release/${{ env.BINARY_NAME }} release/
          cd release && tar -czf ../${{ env.BINARY_NAME }}.tar.gz *

      - name: 打 tag
        if: steps.version.outputs.published == 'false'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: 发布
        if: steps.version.outputs.published == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: ${{ env.BINARY_NAME }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
