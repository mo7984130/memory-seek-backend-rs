---
- name: 检查已签发的 TLS 证书
  stat:
    path: /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem
  register: nginx_tls_certificate

- name: 配置 HTTPS Nginx 站点
  template:
    src: site.conf.j2
    dest: "/etc/nginx/conf.d/{{ domain_name }}-ssl.conf"
    owner: root
    group: root
    mode: '0644'
  vars:
    nginx_tls_enabled: "{{ nginx_tls_certificate.stat.exists }}"
  notify: reload nginx

- name: 验证 HTTPS Nginx 配置
  command: nginx -t
  changed_when: false

- name: 应用 HTTPS 配置
  meta: flush_handlers
