[package]
name = "backup"
version = "0.1.6"
edition = "2024"

[features]
default = []
metrics = ["common/metrics", "dep:metrics", "oss/metrics"]
audit = ["audit/enable"]

[dependencies]
audit = { path = "../audit" }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
metrics = { workspace = true, optional = true }

csv = { workspace = true }
tokio-cron-scheduler = { workspace = true }

# S3
oss = { path = "../../libs/oss" }

# HTTP / 控制器
axum = { workspace = true }

# 实体（UserId）
types = { path = "../../types", features = ["orm"] }

# 错误处理
common = { path = "../../common", features = ["orm"] }
