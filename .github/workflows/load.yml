name: Load Test

on:
    workflow_dispatch:
        inputs:
            mode:
                description: "compare = 对比基线(默认); baseline = 刷新 develop 基线"
                required: true
                type: choice
                default: compare
                options:
                    - compare
                    - baseline
            ref:
                description: "被测分支/ref, 默认 develop(main 分支的 workflow 不含缓存/诊断逻辑)"
                required: false
                type: string
                default: "develop"
            runs:
                description: "每场景压测轮次(取中位数)"
                required: false
                type: number
                default: 3
            pr_number:
                description: "将报告发布为该 PR 评论(可选)"
                required: false
                type: number
                default: 0
            load_mode:
                description: "both = target + max 一起跑(默认); target = 仅目标 QPS; max = 仅极限加压"
                required: true
                type: choice
                default: both
                options:
                    - both
                    - target
                    - max
            server_cpus:
                description: "被测 server 占用核数(控制变量, 默认 2)"
                required: false
                type: number
                default: 2
    # PR 合并到 main 后自动压测(push 事件由合并产生)
    push:
        branches: [main]
    schedule:
        # 每周一 02:00 自动刷新 develop 基线
        - cron: "0 2 * * 1"

# PR 评论/commit 评论需要写权限; actions:write 供缓存保存
permissions:
    contents: write
    actions: write
    issues: write
    pull-requests: write

# 同一 PR 内新 push 自动取消旧 run, 避免重复压测堆积
concurrency:
    group: load-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    load:
        runs-on: ubuntu-latest
        env:
            FEATURES: metrics,auth,user,photo,face-engine
            # 合并到 main 默认完整跑 3 轮; 手动触发可覆盖 runs
            RUNS: ${{ inputs.runs || 3 }}
            # 负载模型: both(默认) = target + max 一起; target / max = 仅单一
            LOAD_MODE: ${{ inputs.load_mode || 'both' }}
            # 被测 server 占用核数(控制变量, 默认 2)
            SERVER_CPUS: ${{ inputs.server_cpus || 2 }}
            # schedule -> baseline, 其它(手动/PR) -> compare
            MODE: ${{ github.event_name == 'schedule' && 'baseline' || inputs.mode || 'compare' }}
            PR_NUMBER: ${{ inputs.pr_number != 0 && inputs.pr_number || github.event.pull_request.number || '0' }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.ref || github.ref }}
                  # ONNX 模型经 git-lfs 托管, 必须拉取真实文件(默认 lfs: false 只会得到指针)
                  lfs: true

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable

            # 依赖/target 缓存(key 基于 Cargo.lock + 平台, 不随 commit 变;
            # 默认不缓存最终可执行文件, 业务 crate 每次增量编译)
            - uses: Swatinem/rust-cache@v2
              with:
                  # 压测可能失败/取消: 失败也保存缓存, 否则 release 依赖从未落盘,
                  # 每次都会全量编译
                  cache-on-failure: true

            - name: Build (release + metrics)
              run: cargo build --release --features "$FEATURES"

            - name: Install k6
              uses: grafana/setup-k6-action@v1
              with:
                  # 场景脚本使用可选链 ?., 需 >= 0.50(0.49 编译器不支持)
                  k6-version: 0.57.0

            - name: 启动依赖与全部 server 实例 (make ci-up)
              # 容器(PG/Redis) + 8 个 server 实例并行启动, 各自 taskset 限核(SERVER_CPUS)
              # SKIP_BUILD=1: release 已在上一构建步骤完成, 避免重复编译
              run: make -C tests/load ci-up SKIP_BUILD=1 SERVER_CPUS=$SERVER_CPUS

            - name: 种子数据 (建表 + 灌数据)
              # 不再容错: seed 失败必须暴露(否则压测会在无表库上全量报错)
              run: make -C tests/load seed

            - name: 全场景压测 target (${{ env.RUNS }} 轮)
              # both/target 模式跑 target 负载(对比用, 结果进基线)
              if: contains(fromJSON('["both","target"]'), env.LOAD_MODE)
              run: make -C tests/load run-all RUNS=$RUNS LOAD_MODE=target

            - name: 全场景压测 max (${{ env.RUNS }} 轮)
              # both/max 模式跑 max 极限负载(找上限, 结果进 max-normalized)
              if: contains(fromJSON('["both","max"]'), env.LOAD_MODE)
              run: make -C tests/load run-max RUNS=$RUNS LOAD_MODE=max

            - name: 归一化 target (取中位数)
              if: contains(fromJSON('["both","target"]'), env.LOAD_MODE)
              run: make -C tests/load collect

            - name: 归一化 max (取中位数)
              if: contains(fromJSON('["both","max"]'), env.LOAD_MODE)
              run: make -C tests/load collect-max

            - name: 服务端指标快照
              run: make -C tests/load prometheus || true

            - name: 记录基线 (baseline 模式, target 负载)
              if: env.MODE == 'baseline' && contains(fromJSON('["both","target"]'), env.LOAD_MODE)
              run: make -C tests/load record-baseline

            - name: 恢复基线缓存 (compare 模式)
              if: env.MODE == 'compare' && contains(fromJSON('["both","target"]'), env.LOAD_MODE)
              uses: actions/cache/restore@v4
              with:
                  path: tests/load/baselines
                  key: load-baseline-develop-
                  restore-keys: load-baseline-develop-

            - name: 判定 (compare 模式, target 负载)
              if: env.MODE == 'compare' && contains(fromJSON('["both","target"]'), env.LOAD_MODE)
              run: make -C tests/load judge

            - name: 生成报告 (compare 模式)
              if: env.MODE == 'compare' && contains(fromJSON('["both","target"]'), env.LOAD_MODE)
              run: make -C tests/load report

            - name: 保存基线缓存 (baseline 模式, target 负载)
              if: env.MODE == 'baseline' && contains(fromJSON('["both","target"]'), env.LOAD_MODE)
              continue-on-error: true # 同 sha 重复保存时忽略冲突
              uses: actions/cache/save@v4
              with:
                  path: tests/load/baselines
                  key: load-baseline-develop-${{ github.sha }}

            - name: 上传结果 (artifact, 无论成败)
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: load-results-${{ env.MODE }}-${{ github.sha }}
                  path: |
                      tests/load/results
                      tests/load/ci/server-*.log

            - name: 失败诊断 (打印各实例 server.log 与结果目录)
              if: failure()
              run: |
                  echo "===== 各实例 server log (tail 200) ====="
                  for f in tests/load/ci/server-*.log; do
                      echo "--- $f ---"
                      tail -200 "$f" 2>/dev/null || echo "(不存在)"
                  done
                  echo "===== results 目录 ====="
                  ls -la tests/load/results/ 2>/dev/null || true

            - name: 发布结果评论 (commit 评论 + 关联 PR 评论)
              if: env.MODE == 'compare' && (env.PR_NUMBER != '0' || github.event_name == 'push')
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('fs');
                      const path = 'tests/load/results/report.md';
                      if (!fs.existsSync(path)) {
                          // 报告缺失必须暴露, 避免"静默无评论"误以为发布成功
                          throw new Error('report.md 不存在, 无法发布评论(请检查 judge/report 步骤)');
                      }
                      let body = fs.readFileSync(path, 'utf8');
                      if (body.length > 60000) body = body.slice(0, 60000) + '\n...(已截断)';
                      const prNum = Number('${{ env.PR_NUMBER }}');
                      if (prNum > 0) {
                          // 手动触发指定 PR 号: 发 PR 评论
                          await github.rest.issues.createComment({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              issue_number: prNum,
                              body
                          });
                      } else {
                          // 合并到 main(push): 发布为该合并 commit 的评论
                          await github.rest.repos.createCommitComment({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              commit_sha: context.sha,
                              body
                          });
                          // 同时发布到该 commit 关联的 PR, 提升可见性
                          try {
                              const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                                  owner: context.repo.owner,
                                  repo: context.repo.repo,
                                  commit_sha: context.sha
                              });
                              for (const pr of prs) {
                                  await github.rest.issues.createComment({
                                      owner: context.repo.owner,
                                      repo: context.repo.repo,
                                      issue_number: pr.number,
                                      body
                                  });
                              }
                          } catch (e) {
                              console.log('查询/发布关联 PR 评论失败(不影响 commit 评论): ' + e.message);
                          }
                      }
