name: Load Test

# 压测: 与 e2e.yml 共用 e2e crate 与同一套环境骨架(.github/actions/e2e-stack),
# 差异只在 RunMode —— 这里用 duration(固定时长) + 32 并发, 只做指标与基线对比, 不做断言裁剪。
#
# 报告与判定: tests/e2e/ci/load_compare.py(逐场景 P95 对比基线 + 绝对阈值)。
on:
    workflow_dispatch:
        inputs:
            mode:
                description: "compare = 对比基线(默认); baseline = 刷新 develop 基线"
                required: true
                type: choice
                default: compare
                options:
                    - compare
                    - baseline
            ref:
                description: "被测分支/ref, 默认 develop(main 分支的 workflow 不含缓存/诊断逻辑)"
                required: false
                type: string
                default: "develop"
            duration_secs:
                description: "每场景压测时长(秒)。串行执行全部场景, 总时长 ≈ 场景数 × 该值"
                required: false
                type: number
                default: 15
            pr_number:
                description: "将报告发布为该 PR 评论(可选)"
                required: false
                type: number
                default: 0
            server_cpus:
                description: "被测 server 占用核数(控制变量, 默认 2)"
                required: false
                type: number
                default: 2
            target_url:
                description: "外部测试服务器完整 URL;留空则在 runner 自建环境。外部目标须已灌种子, 且其 PG/Redis/S3/MailHog 对 runner 可达(将跳过 preprea, 不写对方种子数据)"
                required: false
                type: string
                default: ""
    # PR 合并到 main 后自动压测(push 事件由合并产生)
    push:
        branches: [main]
    schedule:
        # 每周一 02:00 自动刷新 develop 基线
        - cron: "0 2 * * 1"

# PR 评论/commit 评论需要写权限; actions:write 供缓存保存
permissions:
    contents: write
    actions: write
    issues: write
    pull-requests: write

# 同一 PR 内新 push 自动取消旧 run, 避免重复压测堆积
concurrency:
    group: load-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    load:
        runs-on: ubuntu-latest
        env:
            FEATURES: metrics,auth,user,visual,face-engine
            # 被测服务地址: 留空 target_url 时用 runner 自建环境
            BASE_URL: ${{ inputs.target_url || 'http://127.0.0.1:7985' }}
            # 被测 server 占用核数(控制变量)
            SERVER_CPUS: ${{ inputs.server_cpus || 2 }}
            # 每场景压测时长: Duration 是场景粒度, 全部场景串行 → 总时长 ≈ 场景数 × 该值
            DURATION_SECS: ${{ inputs.duration_secs || 15 }}
            # schedule -> baseline, 其它(手动/PR) -> compare
            MODE: ${{ github.event_name == 'schedule' && 'baseline' || inputs.mode || 'compare' }}
            PR_NUMBER: ${{ inputs.pr_number != 0 && inputs.pr_number || github.event.pull_request.number || '0' }}
            # ---- e2e crate 运行参数: 与 e2e.yml 的唯一差异就是 RunMode ----
            E2E__SERVER__URL: ${{ inputs.target_url || 'http://127.0.0.1:7985' }}
            E2E__RUN__MODE: duration
            E2E__RUN__DURATION_SECS: ${{ inputs.duration_secs || 15 }}
            E2E__RUN__CONCURRENCY: "32"
            # 剔除"断言型"场景: UploadDuplicateVisualScenario 每轮都打上传接口(期望 400),
            # 而上传接口按 CPU 核数限流(CI 里 server 限 2 核 → 2 个许可), 饱和时返回 503,
            # 断言就退化成限流统计(实测通过率 25.5%)。正确性验收(e2e.yml)仍会跑它。
            # VideoDerivativeScenario 会触发真实视频转码(单 worker 串行), 压测下会拖长耗时
            # 并增加 CPU 负载; DownloadImageThumbnailScenario 走本地图片处理(CPU)。
            # 两者同 UploadDuplicateVisualScenario 一样只在正确性验收(e2e.yml)中跑。
            E2E__RUN__EXCLUDE: UploadDuplicateVisualScenario,VideoDerivativeScenario,DownloadImageThumbnailScenario,DownloadImageCropScenario
            # 自建环境每轮重建种子; 外部目标跳过(否则会清空对方数据)
            # 注意: push/schedule 触发时 inputs 为空, 必须用 `|| ''` 归一化后再比较
            E2E__RUN__PREPARE: ${{ (inputs.target_url || '') == '' && 'true' || 'false' }}
            # 压测放宽到 1% 失败 / 0.5% 超时(更严的判定交给 load_compare.py)
            E2E__RUN__MAX_FAILURE_RATE: "0.01"
            E2E__RUN__MAX_TIMEOUT_RATE: "0.005"
            E2E_REPORT_JSON: load-report.json
            # ---- 报告判定阈值 ----
            MIN_PASS_RATE: "0.99"
            MAX_P95_REGRESSION_PCT: "20"
            MIN_RPS_RATIO: "0.9"
            MAX_TIMEOUT_RATE: "0.005"
            MAX_TEARDOWN_FAIL_RATE: "0.02"
            BASELINE_DIR: tests/e2e/ci/baselines
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.ref || github.ref }}
                  # ONNX 模型经 git-lfs 托管, 必须拉取真实文件(默认 lfs: false 只会得到指针)
                  lfs: true

            # 外部目标模式只做压测发起端: 不构建 server, 但仍需编译 e2e 二进制
            - name: Install Rust (外部目标模式)
              if: (inputs.target_url || '') != ''
              uses: dtolnay/rust-toolchain@stable

            - name: Install mold (外部目标模式)
              # .cargo/config.toml 指定 -fuse-ld=mold, 缺失时链接会直接报错
              if: (inputs.target_url || '') != ''
              run: sudo apt-get update && sudo apt-get install -y mold

            - uses: Swatinem/rust-cache@v2
              if: (inputs.target_url || '') != ''
              with:
                  cache-on-failure: true

            - name: 构建并启动被测环境
              if: (inputs.target_url || '') == ''
              uses: ./.github/actions/e2e-stack
              with:
                  features: ${{ env.FEATURES }}
                  server-config: tests/run/config.yml
                  server-cpus: ${{ env.SERVER_CPUS }}

            - name: 检查外部测试服务器
              if: (inputs.target_url || '') != ''
              run: |
                  curl --fail --show-error --silent --max-time 15 "$BASE_URL/health" >/dev/null
                  echo "external load-test target is ready: $BASE_URL"
                  echo "注意: 外部目标不灌种子(prepare=false), 请自行保证种子数据与运行前的干净状态"

            - name: 压测 (duration ${{ env.DURATION_SECS }}s/场景)
              # 全部场景(含写场景, 各自在 teardown 回收产物), 逐场景串行执行;
              # RunMode=Duration 是场景粒度, 总时长 ≈ 场景数 × 每场景时长
              run: cargo run -p e2e --release -- -c tests/e2e/e2e.config.yml --report-json "$E2E_REPORT_JSON"

            - name: 服务端指标快照
              if: always()
              run: curl --silent --max-time 15 "$BASE_URL/metrics" > prometheus.txt || true

            - name: 收敛服务端日志 (控制 artifact 体积)
              # duration 模式下过载告警可能达数百 MB; 只留尾部足够定位问题
              if: always()
              run: tail -n 20000 server.log > server.log.tail 2>/dev/null || true

            - name: 恢复基线缓存 (compare 模式)
              if: env.MODE == 'compare'
              uses: actions/cache/restore@v4
              with:
                  path: tests/e2e/ci/baselines
                  key: load-baseline-develop-
                  restore-keys: load-baseline-develop-

            - name: 判定与报告 (compare 模式)
              if: env.MODE == 'compare'
              run: |
                  python3 tests/e2e/ci/load_compare.py \
                      --current "$E2E_REPORT_JSON" \
                      --baseline "$BASELINE_DIR/load-baseline.json" \
                      --markdown load-report.md

            - name: 记录基线 (baseline 模式)
              if: env.MODE == 'baseline'
              run: |
                  python3 tests/e2e/ci/load_compare.py \
                      --current "$E2E_REPORT_JSON" \
                      --write-baseline "$BASELINE_DIR/load-baseline.json" \
                      --markdown load-report.md

            - name: 保存基线缓存 (baseline 模式)
              if: env.MODE == 'baseline'
              continue-on-error: true # 同 sha 重复保存时忽略冲突
              uses: actions/cache/save@v4
              with:
                  path: tests/e2e/ci/baselines
                  key: load-baseline-develop-${{ github.sha }}

            - name: 上传结果 (artifact, 无论成败)
              id: load-results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: load-results-${{ env.MODE }}-${{ github.sha }}
                  path: |
                      load-report.json
                      load-report.md
                      prometheus.txt
                      server.log.tail

            - name: 失败诊断 (打印 server.log 与判定结论)
              if: failure()
              run: |
                  echo "===== 判定 / 报告 ====="
                  cat load-report.md 2>/dev/null || echo "(load-report.md 不存在)"
                  echo "===== server.log (tail 200) ====="
                  tail -200 server.log 2>/dev/null || echo "(server.log 不存在)"

            - name: 发布结果评论 (commit 评论 + 关联 PR 评论)
              if: always() && env.MODE == 'compare' && (env.PR_NUMBER != '0' || github.event_name == 'push')
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('fs');
                      const path = 'load-report.md';
                      if (!fs.existsSync(path)) {
                          // 环境未起来(构建失败等)时没有报告, 不应把工作流自身的问题报成压测结论
                          core.warning('load-report.md 不存在, 跳过发布评论');
                          return;
                      }
                      let body = fs.readFileSync(path, 'utf8');
                      if (body.length > 60000) body = body.slice(0, 60000) + '\n...(已截断)';
                      // 附上本次跑批与结果产物链接, 便于从评论直接点进去
                      const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
                      const artifactUrl = '${{ steps.load-results.outputs.artifact-url }}';
                      const links = artifactUrl
                          ? `> 本次跑批: [run #${context.runNumber}](${runUrl}) · [结果产物](${artifactUrl})\n\n`
                          : `> 本次跑批: [run #${context.runNumber}](${runUrl})\n\n`;
                      body = links + body;
                      const prNum = Number('${{ env.PR_NUMBER }}');
                      if (prNum > 0) {
                          // 手动触发指定 PR 号: 发 PR 评论
                          await github.rest.issues.createComment({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              issue_number: prNum,
                              body
                          });
                      } else {
                          // 合并到 main(push): 发布为该合并 commit 的评论
                          await github.rest.repos.createCommitComment({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              commit_sha: context.sha,
                              body
                          });
                          // 同时发布到该 commit 关联的 PR, 提升可见性
                          try {
                              const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                                  owner: context.repo.owner,
                                  repo: context.repo.repo,
                                  commit_sha: context.sha
                              });
                              for (const pr of prs) {
                                  await github.rest.issues.createComment({
                                      owner: context.repo.owner,
                                      repo: context.repo.repo,
                                      issue_number: pr.number,
                                      body
                                  });
                              }
                          } catch (e) {
                              console.log('查询/发布关联 PR 评论失败(不影响 commit 评论): ' + e.message);
                          }
                      }

            - name: 清理
              if: always()
              run: |
                  if [ -f server.pid ]; then kill "$(cat server.pid)" 2>/dev/null || true; fi
                  docker compose -f tests/run/docker-compose.yml down -v || true
