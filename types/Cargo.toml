[package]
name = "types"
version = "0.11.0"
edition = "2024"
description = "Shared types for memory-seek: ID types, DTOs, SeaORM entities"

[features]
default = ["lightweight"]

lightweight = []
ts = [
    "dep:ts-rs",
    "types-core/ts",
    "types-token/ts",
    "types-audit/ts",
    "types-identity/ts",
]
orm = [
    "dep:sea-orm",
    "dep:linkme",
    "dep:types-db-api",
    "types-core/orm",
    "types-audit/orm",
    "types-identity/orm",
]
face-engine = ["orm", "dep:insight-face-rs", "types-token/face-engine"]

[dependencies]
common.path = "../common"
types-core.workspace = true
types-token.workspace = true
types-backup.workspace = true
types-audit.workspace = true
types-identity.workspace = true

types-db-api = { workspace = true, optional = true }

serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
validator.workspace = true
thiserror.workspace = true
derive_more.workspace = true
base64.workspace = true
regex.workspace = true


sea-orm = { workspace = true, features = ["sqlx-postgres", "macros", "schema-sync", "entity-registry"], optional = true }
insight-face-rs = { workspace = true, features = ["pgvector"], optional = true }
ts-rs = { workspace = true, optional = true }
linkme = { workspace = true, optional = true }
tracing.workspace = true
