[package]
name = "types-admin"
version = "0.1.0"
edition = "2024"

[features]
default = []
orm = ["dep:sea-orm", "dep:linkme", "types-db-registry"]
ts = ["dep:ts-rs", "types-core/ts", "types-visual/ts"]

[dependencies]
common-core = { workspace = true }
types-core = { workspace = true }
types-visual = { workspace = true }
types-db-registry = { path = "../db-registry", optional = true }
serde.workspace = true
serde_json.workspace = true
validator.workspace = true
sea-orm = { workspace = true, optional = true }
ts-rs = { workspace = true, optional = true }
linkme = { workspace = true, optional = true }
