[package]
name = "audit"
version = "0.2.0"
edition = "2024"

[features]
default = []
recording = ["common/snowflake"]
controller = ["dep:axum"]

[dependencies]
common = { path = "../../common", features = ["contextual-sea-orm", "validators"] }
sea-orm = { workspace = true }
types = { path = "../../types", features = ["orm"] }
axum = { workspace = true, optional = true }
