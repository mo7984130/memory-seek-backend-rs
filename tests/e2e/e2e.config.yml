# e2e 测试配置文件(读取逻辑与 server 一致: CLI --config > E2E_CONFIG_PATH > 默认路径)
server:
    host: 127.0.0.1
    port: 7985

database:
    url: "postgres://memory_seek_test:memory_seek_test@localhost:54329/memory_seek_test"

redis:
    url: "redis://localhost:63799"

# MailHog(收件验证码): docker-compose 已映射 8025
mailhog:
    url: "http://localhost:8025"

# S3(头像对象回查): 需与 server 运行时的 s3 段一致(见 tests/config.yml)
s3:
    endpoint: "http://localhost:9000"
    bucket: "memory-seek-test"
    access_key: "memory_seek_test"
    secret_key: "memory_seek_test"
    region: "us-east-1"
    # rustfs 需 path-style 寻址
    force_path_style: true

# TokenCipher(解密 avatar_token): 必须与 server 的 token_cipher 完全一致
token_cipher:
    key: "test"
    salt: "test"

# 种子数据量(preprea::init 灌入; 环境变量 E2E__SEED__* 可覆盖)
seed:
    auth_users: 10000
    photo_users: 2000
    photos_per_user: 20
    faces_per_person: 5
    # user 模块专属测试用户池大小(uit_user_* / uit_pwd_*)
    uit_users: 32
