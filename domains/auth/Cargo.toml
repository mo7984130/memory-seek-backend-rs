[package]
name = "auth"
version = "0.3.1"
edition = "2024"

[features]
default = []
metrics = ["email/metrics"]
controller = ["dep:axum", "dep:common-web"]
audit = ["audit/recording"]

[dependencies]
audit = { path = "../audit" }
types-identity = { workspace = true, features = ["orm"] }
common-core = { workspace = true, features = ["tokio"] }
common-cache = { workspace = true }
common-crypto = { workspace = true }
common-db = { workspace = true }
common-metrics = { workspace = true }
common-web = { workspace = true, optional = true }
constants.path = "../constants"
email.path = "../../libs/email"
common_macros.path = "../../libs/common_macros"

tokio.workspace = true
tracing.workspace = true
sea-orm.workspace = true
axum = { workspace = true, optional = true }
