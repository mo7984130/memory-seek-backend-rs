# tests/load/docker-compose.load.yml
# 压测环境编排: 仅编排依赖服务。
# server 以宿主机进程运行(直接跑 target/release 二进制, 避免容器内重复编译 Rust)。
#
# 用法:
#   docker compose -f tests/load/docker-compose.load.yml up -d --wait
#   docker compose -f tests/load/docker-compose.load.yml down
#
# 说明: 端口使用非常规值, 避免与本机已有 PG/Redis 冲突。
#   PG    54329 -> 5432   (server-config.yml 中 database.url 指向)
#   Redis 63799 -> 6379   (server-config.yml 中 redis.url 指向)

services:
  postgres:
    # 含 pgvector 扩展(init.sql 需 CREATE EXTENSION vector, 官方镜像不含)
    image: pgvector/pgvector:pg16
    container_name: memory-seek-load-pg
    environment:
      POSTGRES_USER: memory_seek
      POSTGRES_PASSWORD: memseek_loadtest
      POSTGRES_DB: memory_seek
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory_seek -d memory_seek"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    container_name: memory-seek-load-redis
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "63799:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
