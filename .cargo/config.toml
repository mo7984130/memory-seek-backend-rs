# TypeScript 类型导出配置
#
# ts-rs 原生导出机制（#[ts(export, export_to = "...")]）：
# 编译带 ts feature 的 crate 时自动把类型写到统一输出目录，
# 无需手动维护导出清单（旧方案 tools/export-ts bin 已移除）。
#
# relative = true 表示相对本配置文件所在目录（仓库根），
# 因此 types / common / photo 三个 crate 都会输出到仓库根 bindings/ 下，
# 目录归属由各类型上的 export_to 属性决定（auth / photo / user）。
[env]
TS_RS_EXPORT_DIR = { value = "target/bindings", relative = true }

[build]
rustflags = ["-C", "target-cpu=x86-64-v3"]
