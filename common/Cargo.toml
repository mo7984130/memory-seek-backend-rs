[package]
name = "common"
version = "0.4.0"
edition = "2024"

[features]
default = []

metrics = ["dep:metrics"]
tokio = ["dep:tokio"]
ts = ["dep:ts-rs"]
axum = ["dep:axum", "dep:validator"]
multi-cache = ["dep:multi-level-cache"]
snowflake = ["dep:snowflaked"]

[dependencies]
common_macros.path = "../libs/common_macros"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sea-orm.workspace = true
rand.workspace = true
deadpool-redis.workspace = true
redis.workspace = true
tracing.workspace = true
hex.workspace = true
bcrypt.workspace = true
argon2.workspace = true
password-hash.workspace = true
aes-gcm.workspace = true
hkdf.workspace = true
sha2.workspace = true
base64.workspace = true
chrono.workspace = true
async-trait.workspace = true

tokio = { workspace = true, optional = true }
ts-rs = { workspace = true, optional = true }
snowflaked = { workspace = true, optional = true }
multi-level-cache = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
validator = { workspace = true, optional = true }
metrics = { workspace = true, optional = true }
