# 测试依赖(PG+pgvector / valkey / MailHog / rustfs)。
#
# 镜像一律使用官方名称, 便于 GitHub Actions 等境外环境直接拉取。
# 中国大陆本地开发可在 podman 的 registries.conf 里给 docker.io 配置镜像站:
#   [[registry]]
#   prefix = "docker.io"
#   location = "docker.1panel.live"
services:
    postgres:
        image: pgvector/pgvector:pg16
        container_name: memory-seek-test-pg
        environment:
            POSTGRES_USER: memory_seek_test
            POSTGRES_PASSWORD: memory_seek_test
            POSTGRES_DB: memory_seek_test
        ports:
            - "54329:5432"
        tmpfs:
            - /var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U memory_seek_test -d memory_seek_test"]
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 10s

    postgres-init:
        image: pgvector/pgvector:pg16
        container_name: memory-seek-test-pg-init
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            PGPASSWORD: memory_seek_test
        restart: "no"
        command:
            - psql
            - -h
            - postgres
            - -U
            - memory_seek_test
            - -d
            - memory_seek_test
            - -c
            - CREATE EXTENSION IF NOT EXISTS vector;

    valkey:
        image: valkey/valkey:8-alpine
        container_name: memory-seek-test-valkey
        command: ["valkey-server", "--save", "", "--appendonly", "no"]
        ports:
            - "63799:6379"
        tmpfs:
            - /data

    mailhog:
        image: mailhog/mailhog:latest
        container_name: memory-seek-test-mailhog
        ports:
            - "1025:1025"
            - "8025:8025"

    rustfs:
        image: rustfs/rustfs:1.0.0
        container_name: memory-seek-test-rustfs
        command: /data
        environment:
            RUSTFS_ACCESS_KEY: memory_seek_test
            RUSTFS_SECRET_KEY: memory_seek_test
        ports:
            - "9000:9000"
        tmpfs:
            # rootless podman 的 tmpfs 默认属主是宿主 uid(=容器内 root),权限 750,
            # 而镜像以非 root 用户 rustfs(uid 10001)运行,写 /data 会 Permission denied,
            # 因此显式指定 mode=1777 与 Docker 默认 tmpfs 语义一致。
            - /data:mode=1777

    rustfs-init:
        # 建桶初始化用 aws-cli(Docker Hub 官方镜像, 持续维护);
        # 原 minio/mc 已从 Docker Hub 下架(MinIO 整体迁至 quay)。
        # 自定义端点必须用 path-style 寻址: 默认 auto 会优先 virtual-host,
        # 而容器名无法作为子域解析(官方文档: 该键对 s3/s3api 均生效)。
        image: amazon/aws-cli:latest
        container_name: memory-seek-test-rustfs-init
        depends_on:
            - rustfs
        entrypoint: >
            /bin/sh -c "
            set -e;
            export AWS_ACCESS_KEY_ID=memory_seek_test;
            export AWS_SECRET_ACCESS_KEY=memory_seek_test;
            export AWS_DEFAULT_REGION=us-east-1;
            aws configure set default.s3.addressing_style path;
            until aws --endpoint-url http://rustfs:9000 s3api list-buckets >/dev/null 2>&1; do
                echo 'waiting for RustFS...';
                sleep 1;
            done;
            if ! aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket memory-seek-test 2>/dev/null; then
                aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket memory-seek-test;
            fi;
            echo 'bucket ready';
            "

    server:
        # 直接复用本地构建产物(build/build.sh 输出到 target/dist),
        # 底座与 Dockerfile.build 一致(ubuntu 22.04), 保证 glibc 兼容。
        image: ubuntu:22.04
        container_name: memory-seek-test-server
        depends_on:
            postgres-init:
                condition: service_completed_successfully
            valkey:
                condition: service_started
            mailhog:
                condition: service_started
            rustfs-init:
                condition: service_completed_successfully
        volumes:
            - ../../target/dist/memory-seek-server:/app/memory-seek-server:ro
            - ../../target/dist/libs:/app/libs:ro
            - ../../target/dist/models:/app/models:ro
            - ./config.yml:/app/config.yml:ro
        environment:
            # onnxruntime 等动态库
            # LD_LIBRARY_PATH: /app/libs
            # 容器内通过服务名访问依赖, 覆盖 config.yml 中的 localhost 映射地址
            MEMORY_SEEK_DATABASE__URL: "postgres://memory_seek_test:memory_seek_test@postgres:5432/memory_seek_test"
            MEMORY_SEEK_REDIS__URL: "redis://valkey:6379"
            MEMORY_SEEK_SMTP__SERVER: mailhog
            MEMORY_SEEK_S3__ENDPOINT: "http://rustfs:9000"
            # config.yml 中模型路径指向宿主机的 ./target/dist/models, 容器内改为挂载路径
            MEMORY_SEEK_FACE_ENGINE__DETECT_MODEL_PATH: /app/models/det.onnx
            MEMORY_SEEK_FACE_ENGINE__RECOGNIZE_MODEL_PATH: /app/models/rec.onnx
        ports:
            - "7985:7985"
        command: /app/memory-seek-server -c /app/config.yml
        healthcheck:
            # ubuntu:22.04 无 curl, 用 bash 的 /dev/tcp 探活
            test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/7985' || exit 1"]
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 10s
