[package]
name = "user"
version = "0.1.21"
edition = "2024"

[features]
default = []
metrics = ["common/metrics", "multi-level-cache/metrics"]
controller = ["dep:axum"]
audit = ["audit/recording"]

[dependencies]
common = { path = "../../common", features = [
    "file_validator",
    "validators",
    "metrics",
    "contextual-sea-orm",
    "contextual-redis",
    "contextual-cache",
    "contextual-tokio",
] }
audit.path = "../audit"
constants.path = "../constants"
oss.path = "../../libs/oss"
types = { workspace = true, features = ["orm"] }

multi-level-cache.workspace = true
serde.workspace = true
sea-orm.workspace = true
uuid.workspace = true
redis.workspace = true
tracing.workspace = true
tokio.workspace = true
bytes.workspace = true

axum = { workspace = true, optional = true }
