[package]
name = "types"
version = "0.11.0"
edition = "2024"
description = "Shared types for memory-seek: ID types, DTOs, SeaORM entities"

[features]
default = ["lightweight"]

lightweight = []
ts = ["dep:ts-rs", "types-core/ts"]
orm = ["dep:sea-orm", "dep:linkme", "types-core/orm"]
face-engine = ["orm", "dep:insight-face-rs"]

[dependencies]
common.path = "../common"
types-core.workspace = true

serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
validator.workspace = true
thiserror.workspace = true
derive_more.workspace = true
base64.workspace = true
regex.workspace = true


sea-orm = { workspace = true, features = ["sqlx-postgres", "macros", "schema-sync", "entity-registry"], optional = true }
insight-face-rs = { workspace = true, features = ["pgvector"], optional = true }
ts-rs = { workspace = true, optional = true }
linkme = { workspace = true, optional = true }
tracing.workspace = true
