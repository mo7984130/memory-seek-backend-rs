[package]
name = "types"
version = "0.2.1"
edition = "2024"
description = "Shared types for memory-seek: ID types, DTOs, SeaORM entities"

[features]
default = ["lightweight"]

lightweight = []
ts = ["dep:ts-rs"]
orm = ["dep:sea-orm"]
face-engine = ["orm", "dep:insight-face-rs"]

[dependencies]
common.path = "../common"

serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
validator.workspace = true
thiserror.workspace = true
derive_more.workspace = true
base64.workspace = true
regex.workspace = true


sea-orm = { workspace = true, features = ["sqlx-postgres", "macros"], optional = true }
insight-face-rs = { workspace = true, features = ["pgvector"], optional = true }
ts-rs = { workspace = true, optional = true }
