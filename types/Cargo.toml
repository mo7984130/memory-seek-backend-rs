[package]
name = "types"
version = "0.11.0"
edition = "2024"
description = "领域契约门面: 重导出各上下文契约 crate(对外路径保持不变)"

[features]
default = ["lightweight"]

lightweight = []
ts = [
    "types-core/ts",
    "types-token/ts",
    "types-audit/ts",
    "types-identity/ts",
    "types-visual/ts",
]
orm = [
    "dep:sea-orm",
    "dep:linkme",
    "dep:types-db-api",
    "types-core/orm",
    "types-audit/orm",
    "types-identity/orm",
    "types-visual/orm",
]
face-engine = ["orm", "types-token/face-engine", "types-visual/face-engine"]

[dependencies]
common.path = "../common"
types-core.workspace = true
types-token.workspace = true
types-backup.workspace = true
types-audit.workspace = true
types-identity.workspace = true
types-visual.workspace = true

types-db-api = { workspace = true, optional = true }

sea-orm = { workspace = true, features = ["sqlx-postgres", "macros", "schema-sync", "entity-registry"], optional = true }
linkme = { workspace = true, optional = true }
tracing.workspace = true
