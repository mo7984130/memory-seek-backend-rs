[package]
name = "types-visual"
version = "0.4.0"
edition = "2024"
license.workspace = true
description = "视觉上下文契约: 实体、视图与请求 DTO"

[features]
default = []
orm = ["dep:sea-orm", "dep:linkme", "dep:types-db-registry", "types-core/orm", "types-visual-token/crypto"]
face = ["orm", "types-visual-token/orm"]

[dependencies]
types-core.workspace = true
types-visual-token.workspace = true
common_macros.path = "../../libs/common_macros"
common-core.path = "../../common/core"

serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
validator.workspace = true
derive_more.workspace = true

linkme = { workspace = true, optional = true }

types-db-registry = { workspace = true, optional = true }
sea-orm = { workspace = true, features = ["sqlx-postgres", "macros", "entity-registry"], optional = true }

[dev-dependencies]
common-crypto.path = "../../common/crypto"
