[package]
name = "common"
version = "0.9.0"
edition = "2024"
description = "基础设施门面: 重导出各能力 crate(对外路径保持不变)"

[features]
default = []
metrics = ["dep:common-metrics"]
tokio = ["common-core/tokio", "dep:common-runtime"]
ts = ["common-core/ts"]
axum = ["dep:common-web"]
multi-cache = ["common-core/multi-cache"]
snowflake = []

[dependencies]
common-core.path = "core"
common-crypto.path = "crypto"
common-db.path = "db"
common-cache.path = "cache"

common-metrics = { path = "metrics", optional = true }
common-web = { path = "web", optional = true }
common-runtime = { path = "runtime", optional = true }

common_macros.path = "../libs/common_macros"
tracing.workspace = true
