name: E2E

# 端到端正确性验收。
#
# 与 load.yml 共用 e2e crate 与同一套环境骨架(.github/actions/e2e-stack),
# 差异只在 RunMode: 这里用 times(固定轮次) + 32 并发, 任何断言失败都以退出码暴露。
#
# 触发: develop 的 push / pull_request。每次提交实跑全套断言, 失败即红;
# 需要手动重跑时临时加回 `workflow_dispatch:` 即可。
on:
    push:
        branches: [develop]
    pull_request:
        branches: [develop]

jobs:
    e2e:
        name: 端到端测试
        runs-on: ubuntu-latest
        env:
            # server 需要 visual 表(依赖 face-engine)与 /metrics
            FEATURES: metrics,auth,user,visual,face-engine
            # 小种子: 只需覆盖并发池与分页断言(preprea 每次全量重建, CI 里越小越快)
            E2E__SEED__AUTH_USERS: "64"
            E2E__SEED__VISUAL_USERS: "64"
            E2E__SEED__VISUALS_PER_USER: "20"
            E2E__SEED__FACES_PER_PERSON: "5"
            E2E__SEED__UIT_USERS: "64"
            # 运行参数(覆盖 tests/e2e/e2e.config.yml 的 run 段): 固定轮次 + 32 并发
            E2E__RUN__MODE: times
            E2E__RUN__TIMES: "128"
            E2E__RUN__CONCURRENCY: "32"
            # 阈值 0: 任何失败/超时都判失败(错误明细见 stdout 报告与 artifact)
            E2E__RUN__MAX_FAILURE_RATE: "0"
            E2E__RUN__MAX_TIMEOUT_RATE: "0"
            E2E_REPORT_JSON: e2e-report.json
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  # ONNX 模型经 git-lfs 托管, 必须拉取真实文件
                  lfs: true

            - name: 构建并启动被测环境
              uses: ./.github/actions/e2e-stack
              with:
                  features: ${{ env.FEATURES }}
                  server-config: tests/run/config.yml

            - name: 运行 e2e (times)
              # preprea 会灌入种子并清理上轮 e2e 数据, 场景串行执行, 断言失败 → 退出码 1
              run: cargo run -p e2e --release -- -c tests/e2e/e2e.config.yml

            - name: 上传报告 (无论成败)
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: e2e-report-${{ github.sha }}
                  path: |
                      e2e-report.json
                      server.log

            - name: 失败诊断
              if: failure()
              run: |
                  echo "===== server.log (tail 200) ====="
                  tail -200 server.log || true

            - name: 清理
              if: always()
              run: |
                  if [ -f server.pid ]; then kill "$(cat server.pid)" 2>/dev/null || true; fi
                  docker compose -f tests/run/docker-compose.yml down -v || true
