[package]
name = "user"
version = "0.7.0"
edition = "2024"
license.workspace = true

[features]
default = []
metrics = ["multi-level-cache/metrics", "oss/metrics"]
controller = ["dep:axum", "dep:common-web"]
audit = ["audit/recording"]

[dependencies]
blake3.workspace = true
common-core = { workspace = true, features = [
    "multi-cache",
    "tokio"
] }
common-redis = { workspace = true }
common-crypto = { workspace = true }
common-db = { workspace = true }
common-metrics = { workspace = true }
common-web = { workspace = true, optional = true }
file-validator.path = "../../libs/file_validator"
common_macros.path = "../../libs/common_macros"
audit.path = "../audit"
constants.path = "../constants"
oss.path = "../../libs/oss"
types-identity = { workspace = true, features = ["orm"] }
types-core.workspace = true
types-admin.workspace = true
types-visual-token.workspace = true

multi-level-cache.workspace = true
serde.workspace = true
sea-orm.workspace = true
uuid.workspace = true
redis.workspace = true
tracing.workspace = true
tokio.workspace = true
bytes.workspace = true

axum = { workspace = true, optional = true }
