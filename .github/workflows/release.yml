name: Release

on:
    push:
        branches: [main]
    workflow_dispatch:

env:
    CARGO_TERM_COLOR: always
    BINARY_NAME: memory-seek-server

# 版本由人在 PR 里通过 tools/bump-version.sh 决定(写进 server/Cargo.toml),
# 本 workflow 只负责: 发现新版本 -> 构建 -> 打 tag -> 发布。
# tag 已存在说明本次合并没有递增版本, 直接跳过, 不做任何发布。
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 需要完整 tag 历史来判断该版本是否已发布
          fetch-depth: 0
          # server/build.rs 无条件链接 thirdparty/onnxruntime, 必须是真实 .so
          lfs: true

      - name: 读取版本
        id: version
        run: |
          version=$(awk '
              /^\[/ { if (done) exit; in_pkg = ($0 == "[package]"); next }
              in_pkg && /^version = "/ { sub(/^version = "/, ""); sub(/"$/, ""); print; done = 1; exit }
          ' server/Cargo.toml)
          if [[ -z "$version" ]]; then
              echo "错误: 无法从 server/Cargo.toml 的 [package] 段读取 version" >&2
              exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
              echo "published=true" >> "$GITHUB_OUTPUT"
          else
              echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 已发布则跳过
        if: steps.version.outputs.published == 'true'
        run: echo "v${{ steps.version.outputs.version }} 已存在, 本次合并未递增版本, 跳过发布"

      - name: Install Rust toolchain
        if: steps.version.outputs.published == 'false'
        uses: dtolnay/rust-toolchain@stable

      - name: Install mold
        if: steps.version.outputs.published == 'false'
        # .cargo/config.toml 指定 -fuse-ld=mold, 缺失时链接会直接报错
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Cache Cargo
        if: steps.version.outputs.published == 'false'
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        if: steps.version.outputs.published == 'false'
        # 只构建 server: 仓库根是 virtual manifest 且未设 default-members,
        # 不带 -p 会把全部成员(含 tests/e2e)一起编译, 白白增加构建时间与缓存体积。
        # feature 组合收敛在 build/build-release.sh, 与 CI 的 release-build job 共用。
        run: bash build/build-release.sh

      - name: 打包 Release
        if: steps.version.outputs.published == 'false'
        # 只发二进制 + manifest.yaml(约 13MB): libs/models 属"运行时资产",
        # 由 runtime-assets workflow 按内容 hash 单独发布, 不随每次发版重复分发。
        run: |
          version="${{ steps.version.outputs.version }}"
          package="${{ env.BINARY_NAME }}-v${version}-linux-x86_64.tar.gz"
          bash build/package-dist.sh --mode=release \
            --binary "target/release/${{ env.BINARY_NAME }}" \
            --out target/release-package \
            --version "$version"
          tar -czf "$package" -C target/release-package .
          sha256sum "$package" > "${package}.sha256"
          cat target/release-package/manifest.yaml

      - name: 读取运行时资产 id
        if: steps.version.outputs.published == 'false'
        id: assets
        # manifest.yaml 由 package-dist.sh 生成, 形如:
        #   runtime_assets:
        #     id: "791ab6bcc827"
        #     source_sha256: "..."
        run: |
          id=$(sed -n 's/^  id: "\(.*\)"$/\1/p' target/release-package/manifest.yaml)
          sha=$(sed -n 's/^  source_sha256: "\(.*\)"$/\1/p' target/release-package/manifest.yaml)
          if [ -z "$id" ] || [ -z "$sha" ]; then
              echo "错误: 无法从 manifest.yaml 读取运行时资产 id/sha256" >&2
              exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "运行时资产: $id"

      - name: 打 tag
        if: steps.version.outputs.published == 'false'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: 发布
        if: steps.version.outputs.published == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          # 让 "Latest" 指向真正的版本, 而不是运行时资产 release
          make_latest: true
          # 在自动生成的 notes 后面追加依赖说明, 让"一个页面拿全"
          append_body: true
          body: |

            ---

            ### 运行时资产 (libs + models)

            本版本依赖的运行时资产不随二进制重复分发, 按内容 hash 单独发布:

            - 包: ${{ github.server_url }}/${{ github.repository }}/releases/download/runtime-assets/runtime-assets-${{ steps.assets.outputs.id }}.tar.gz
            - sha256: `${{ steps.assets.outputs.sha }}`

            部署脚本会读取包内 `manifest.yaml` 自动安装对应资产; 同一份资产的多个版本可共存。
            人工下载时也可直接到 [runtime-assets](${{ github.server_url }}/${{ github.repository }}/releases/tag/runtime-assets) 页面,
            该页面同时挂着当前版本的二进制包。
          # 二进制包 + 校验和; manifest.yaml 在包内声明所需运行时资产 hash
          files: |
            memory-seek-server-v${{ steps.version.outputs.version }}-linux-x86_64.tar.gz
            memory-seek-server-v${{ steps.version.outputs.version }}-linux-x86_64.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 同步二进制到运行时资产 release
        if: steps.version.outputs.published == 'false'
        # 让 "一个页面拿到二进制 + 运行时资产": 在 runtime-assets release 里始终保留
        # 当前版本的二进制(旧版本会被清理), 避免人工下载要跑两个页面。
        # 注意: 这只是人用入口, 部署仍按版本号从 vX.Y.Z release 取包。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          package="memory-seek-server-v${{ steps.version.outputs.version }}-linux-x86_64.tar.gz"
          if ! gh release view runtime-assets >/dev/null 2>&1; then
              gh release create runtime-assets \
                  --title "运行时资产 (libs + models)" \
                  --notes "按内容 hash 命名的运行时资产包; 同时保留当前版本的二进制包。"
          fi
          gh release upload runtime-assets "$package" "${package}.sha256" --clobber
          # 清理旧版本的二进制, 该 release 只保留当前版本
          gh release view runtime-assets --json assets -q '.assets[].name' \
              | grep -E '^memory-seek-server-v.*-linux-x86_64\.tar\.gz(\.sha256)?$' \
              | grep -vF "$package" \
              | while read -r old; do
                    gh release delete-asset runtime-assets "$old" --yes
                done
