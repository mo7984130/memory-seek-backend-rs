[package]
name = "audit"
version = "0.2.0"
edition = "2024"

[features]
default = []
recording = ["common/snowflake"]
controller = ["dep:axum", "common/axum"]

[dependencies]
common = { path = "../../common", features = ["snowflake"] }
types = { path = "../../types", features = ["orm"] }

# controller 需要
axum = { workspace = true, optional = true }

# mapper 需要
sea-orm = { workspace = true }
