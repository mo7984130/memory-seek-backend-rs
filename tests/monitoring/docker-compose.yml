x-podman:
    in_pod: false

services:
    prometheus:
        image: docker.1panel.live/prom/prometheus:latest
        container_name: prometheus
        userns_mode: "keep-id:uid=1000,gid=1000"
        user: "1000:1000"
        volumes:
            - ./prometheus.yml:/etc/prometheus/prometheus.yml
            - ./data/prometheus:/prometheus
        command:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.console.libraries=/etc/prometheus/console_libraries"
            - "--web.console.templates=/etc/prometheus/console_templates"
        ports:
            - "9090:9090"

    grafana:
        image: docker.1panel.live/grafana/grafana:latest
        container_name: grafana
        ports:
            - "3001:3000"
        environment:
            - GF_SECURITY_ADMIN_PASSWORD=admin
        volumes:
            - ./data/grafana:/var/lib/grafana
            - ./grafana/grafana.yml:/etc/grafana/provisioning/datasources/prometheus.yml
            - ./grafana/dashboards:/var/lib/grafana/dashboards
            - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/default.yaml
        depends_on:
            - prometheus
