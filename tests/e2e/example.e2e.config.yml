# e2e 测试配置示例: 复制为 e2e.config.yml 后按需修改(该文件不入库)
#   cp tests/e2e/example.e2e.config.yml tests/e2e/e2e.config.yml
#
# 路径解析优先级(无默认内容, 全部字段必填): CLI --config / -c > E2E_CONFIG_PATH > 默认路径
# 环境变量可覆盖任意字段, 前缀 E2E, 分隔符 __, 如 E2E__SEED__AUTH_USERS=100
server:
    # 被测 server 的基础地址, 可含路径前缀(如 https://example.com/api)
    url: "http://127.0.0.1:7985"

database:
    url: "postgres://memory_seek_test:memory_seek_test@localhost:54329/memory_seek_test"

redis:
    url: "redis://localhost:63799"

# MailHog(收件验证码): compose 测试栈已映射 8025
mailhog:
    url: "http://localhost:8025"

# S3(头像对象回查): 需与 server 运行时的 s3 段一致(见 tests/config.yml)
s3:
    endpoint: "http://localhost:9000"
    bucket: "memory-seek-test"
    access_key: "memory_seek_test"
    secret_key: "memory_seek_test"
    region: "us-east-1"
    # 对象公开访问地址前缀, 可选; 不设置则用 endpoint 拼接
    # public_url: "http://localhost:9000/memory-seek-test"
    # rustfs 需 path-style 寻址
    force_path_style: true

# TokenCipher(解密 avatar_token): 必须与 server 的 token_cipher 完全一致
token_cipher:
    key: "test"
    salt: "test"

# 种子数据量(preprea::init 灌入; 环境变量 E2E__SEED__* 可覆盖)
seed:
    auth_users: 10000
    visual_users: 2000
    visuals_per_user: 20
    faces_per_person: 5
    # user 模块专属测试用户池大小(uit_user_* / uit_pwd_* / uit_me_* / uit_logout_*);
    # 必须 >= 并发度(run.concurrency), 否则同池账号会串号
    uit_users: 64

# 运行参数(环境变量 E2E__RUN__* 可覆盖任意字段, CI 无需另建配置文件)
run:
    # times = 固定轮次(正确性验收); duration = 固定时长(压测)
    mode: times
    times: 128
    duration_secs: 120
    # 并发度, 约束见 seed 段(需 <= auth_users / visual_users / uit_users)
    concurrency: 32
    # 场景白名单(逗号分隔), 留空 = 全部场景
    scenarios: ""
    # 场景黑名单(逗号分隔), 留空 = 不排除。压测时用它剔除"断言型"场景
    # (饱和负载下断言会退化为限流统计, 例如上传接口过载返回 503 而非期望的 400)
    exclude: ""
    # 超时退避(毫秒), 0 = 关闭; 压测关闭才能暴露过载
    backoff_ms: 0
    # 前置准备(preprea 先清空再灌种子); 外部被测目标 / 复用种子时置 false
    prepare: true
    # 判定阈值: 超过则退出码 1(e2e 用 0; 压测可放宽, 如 0.01)
    max_failure_rate: 0.0
    max_timeout_rate: 0.0
