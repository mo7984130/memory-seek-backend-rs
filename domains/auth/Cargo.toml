[package]
name = "auth"
version = "0.2.0"
edition = "2024"

[features]
default = []
metrics = ["common/metrics"]
controller = ["dep:axum"]
audit = ["audit/recording"]

[dependencies]
audit = { path = "../audit" }
types = { workspace = true, features = ["orm"] }
common = { path = "../../common", features = [
    "validators",
    "metrics",
    "contextual-sea-orm",
    "contextual-redis",
    "contextual-tokio",
] }
constants.path = "../constants"
email.path = "../../libs/email"

tokio.workspace = true
tracing.workspace = true
sea-orm.workspace = true
axum = { workspace = true, optional = true }
