[package]
name = "common"
version = "0.2.1"
edition = "2024"

[features]
default = []
metrics = ["dep:metrics"]
validators = ["dep:validator"]
file_validator = ["dep:image"]
tokio = ["dep:tokio"]
event = ["tokio"]
snowflake = ["dep:snowflaked"]
contextual-sea-orm = []
orm = []
contextual-redis = []
contextual-cache = []
contextual-serde = []
contextual-tokio = ["tokio"]
# TypeScript 类型导出
ts = ["dep:ts-rs"]

[dependencies]
