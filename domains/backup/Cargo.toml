[package]
name = "backup"
version = "0.1.7"
edition = "2024"

[features]
default = []
metrics = ["common/metrics"]
audit = ["audit/recording"]

[dependencies]
audit.path = "../audit"
types = { path = "../../types", features = ["orm"] }
common = { path = "../../common", features = ["axum"] }
