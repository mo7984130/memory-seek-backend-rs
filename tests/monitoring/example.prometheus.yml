# Prometheus 配置示例: 复制为 prometheus.yml 后按需修改(该文件不入库)
#   cp tests/monitoring/example.prometheus.yml tests/monitoring/prometheus.yml
#
# docker-compose 挂载 ./prometheus.yml 为容器内配置, 本地运行前需存在该文件
global:
    scrape_interval: 5s
    evaluation_interval: 2s

scrape_configs:
