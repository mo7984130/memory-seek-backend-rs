---
- name: 校验部署参数
  ansible.builtin.assert:
      that:
          - backend_version is defined
          - binary_version is match('^v[0-9]+\.[0-9]+\.[0-9]+$')
          - vault_db_password is defined
          - vault_redis_password is defined
          - vault_smtp_password is defined
          - vault_s3_access_key is defined
          - vault_s3_secret_key is defined
          - vault_token_cipher_key is defined
          - vault_token_cipher_salt is defined
          - vault_admin_password is defined
      fail_msg: >-
          binary_version 需形如 v2.6.1; 密钥类变量必须存在于
          group_vars/all/vault.yml(执行 ansible-vault edit group_vars/all/vault.yml 补齐)。
      quiet: true

- name: 创建系统用户
  ansible.builtin.user:
      name: "{{ service_user }}"
      system: true
      shell: /usr/sbin/nologin
      create_home: false

- name: 安装基础依赖
  ansible.builtin.apt:
      name:
          - curl
          - ca-certificates
      state: present
      update_cache: true
      cache_valid_time: 3600

- name: 安装带 libsvtav1 的 ffmpeg
  ansible.builtin.include_tasks: ffmpeg.yml
  tags: ffmpeg

- name: 准备目录与配置
  ansible.builtin.include_tasks: create-dirs.yml
  tags: config

- name: 安装二进制
  ansible.builtin.include_tasks: binary.yml

- name: 安装运行时资产(libs + models)
  ansible.builtin.include_tasks: runtime-assets.yml

- name: 切换版本并校验
  ansible.builtin.include_tasks: activate.yml

- name: 创建默认管理员
  ansible.builtin.include_tasks: bootstrap-admin.yml
  tags: admin-user

- name: 清理历史版本与无用资产
  ansible.builtin.include_tasks: prune.yml
