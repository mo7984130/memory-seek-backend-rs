[package]
name = "types"
version = "0.1.11"
edition = "2021"
description = "Shared types for memory-seek: ID types, DTOs, SeaORM entities"

[features]
default = ["lightweight"]

# 轻量模式（前端/WASM 用）：ID 类型 + DTO + 请求参数 + 校验器
lightweight = []

# TypeScript 类型导出
ts = ["dep:ts-rs"]

# 后端数据库实体
orm = ["dep:sea-orm", "dep:sqlx", "dep:pgvector", "dep:common"]

# 人脸识别
face-engine = ["orm", "dep:insight-face-rs", "sea-orm/postgres-vector"]

# 后端全套
full = ["orm", "face-engine"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
chrono = { workspace = true }
validator = { workspace = true }
thiserror = { workspace = true }
derive_more = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }
fancy-regex = { workspace = true }
once_cell = { workspace = true }

ts-rs = { workspace = true, optional = true }

sea-orm = { workspace = true, features = ["sqlx-postgres", "macros"], optional = true }
sqlx = { workspace = true, optional = true }
pgvector = { workspace = true, optional = true }
common = { path = "../common", optional = true }
insight-face-rs = { workspace = true, features = ["pgvector"], optional = true }

[dev-dependencies]
serde_json = { workspace = true }
