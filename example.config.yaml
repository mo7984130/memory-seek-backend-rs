# ── Memory Seek 后端服务配置示例 ──
# 复制此文件为 config.yaml 并修改实际值
# 所有字段均可通过环境变量覆盖: MEMORY_SEEK_<SECTION>__<KEY>
#   例: MEMORY_SEEK_SERVER__PORT=8080
#
# 日志级别通过环境变量 RUST_LOG 控制（默认 info）
# 日志统一输出到 stdout（warn 及以下）/ stderr（error 及以上），不自行维护日志文件，
# 由 systemd journald 捕获管理（参考仓库根目录 memory-seek-server.service）
server:
  host: "0.0.0.0"
  port: 3000

metrics:
  # 基础设施指标采集周期（秒），默认 5
  # 注意: metrics 端点由主服务暴露, 抓取地址为 http://<server_host>:<server_port>/metrics
  interval_seconds: 5

database:
  url: "postgres://user:password@localhost:5432/memory_seek"
  max_connections: 10

redis:
  url: "redis://localhost:6379"
  max_connections: 10

cache:
  # 三级缓存配置（本地 moka → Redis → 数据库）
  # 是否启用缓存。false 时读写全部穿透数据库，便于压测对比，默认 true
  # 压测关闭缓存: MEMORY_SEEK_CACHE__ENABLED=false
  enabled: true
  # L1 本地缓存最大条目数，默认 10000
  # 环境变量覆盖: MEMORY_SEEK_CACHE__LOCAL_CAPACITY=10000
  local_capacity: 10000
  # L1 本地缓存 TTL（秒）。短 TTL 保证多实例下最终一致，默认 60
  # 环境变量覆盖: MEMORY_SEEK_CACHE__LOCAL_TTL_SECS=60
  local_ttl_secs: 60

smtp:
  server: "smtp.example.com"
  port: 587
  username: "your-email@example.com"
  password: "your-password"
  from_email: "noreply@example.com"
  from_name: "MemorySeek"

s3:
  endpoint: "http://localhost:9000"
  bucket: "memory-seek"
  access_key: "your-access-key"
  secret_key: "your-secret-key"
  region: "us-east-1"
  public_url: "http://localhost:9000"
  force_path_style: true

token_cipher:
  key: "your-secret-key-at-least-32-chars"
  salt: "your-salt"

backup:
  enabled: true
  schedule: "0 0 6 * * *"
  local_path: "/var/backups/memory-seek"
  s3_prefix: "backup/"
  retention_days: 3

face_engine:
  detect_model_path: "/path/to/model"
  recognize_model_path: "/path/to/model"
