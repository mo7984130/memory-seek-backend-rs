[package]
name = "types-identity"
version = "0.1.0"
edition = "2024"
description = "用户身份上下文契约: 认证 DTO、用户资料 DTO 与 auth_user 实体"

[features]
default = []
ts = ["dep:ts-rs", "types-core/ts", "types-token/ts"]
orm = ["dep:sea-orm", "dep:types-db-api", "types-core/orm"]

[dependencies]
types-core.workspace = true
types-token.workspace = true
common.path = "../../common"

serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
validator.workspace = true
regex.workspace = true
derive_more.workspace = true
linkme.workspace = true

types-db-api = { workspace = true, optional = true }
sea-orm = { workspace = true, features = ["sqlx-postgres", "macros"], optional = true }
ts-rs = { workspace = true, optional = true }
