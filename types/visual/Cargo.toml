[package]
name = "types-visual"
version = "0.1.0"
edition = "2024"
description = "视觉上下文契约: 实体、视图与请求 DTO"

[features]
default = []
ts = ["dep:ts-rs", "types-core/ts", "types-token/ts"]
orm = ["dep:sea-orm", "dep:linkme", "dep:types-db-api", "types-core/orm"]
face-engine = ["orm", "dep:insight-face-rs", "types-token/face-engine"]

[dependencies]
types-core.workspace = true
types-token.workspace = true
common.path = "../../common"

serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
validator.workspace = true
derive_more.workspace = true

linkme = { workspace = true, optional = true }

types-db-api = { workspace = true, optional = true }
sea-orm = { workspace = true, features = ["sqlx-postgres", "macros", "entity-registry"], optional = true }
ts-rs = { workspace = true, optional = true }
insight-face-rs = { workspace = true, optional = true }
